aid: oatfi
name: Oatfi
description: >-
  OatFi is a fintech infrastructure company that describes itself as "The Modern Credit Network for
  B2B Payments." It provides embedded credit, lending, and working-capital products that platforms
  and marketplaces can offer inside their own payment workflows. Its product surface spans Accounts
  Payable (flexible payment terms for buyers), Accounts Receivable (guaranteed or early supplier
  payouts), and Commercial Charge Cards (scaled credit and capital for commercial card programs),
  backed by modular components for KYB and fraud verification, underwriting, origination, loan
  management, capital-markets access, and collections. OatFi exposes these capabilities through APIs
  for approvals, settlements, and reconciliation. The developer documentation (docs.oatfi.com, a
  ReadMe hub) and dashboard are access-gated, so no public OpenAPI or API reference is available for
  cataloging at this time. Backed by QED Investors.
